[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "shravana"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    # Web
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "httpx>=0.27.0",

    # DB
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",

    # Config
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",

    # Audio
    "ffmpeg-python>=0.2.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.1",
    "noisereduce>=3.0.0",

    # ML — install torch separately (CPU build recommended on no-GPU machines)
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "torchvision>=0.17.0",
    "torchcodec",
    # qwen-asr bundles transformers==4.57.6 which natively supports the
    # qwen3_asr architecture (Qwen3ASRForConditionalGeneration).
    # Do NOT pin the git-HEAD transformers here; it lacks qwen3_asr support.
    "qwen-asr>=0.0.6",
    "qwen-vl-utils>=0.0.14",
    "huggingface-hub>=0.22.0",
    "tqdm>=4.65.0,<5.0.0",
    "accelerate>=0.27.0",
    "faster-whisper>=1.0.0",
    "demucs>=4.0.0",

    # Utils
    "aiofiles>=23.2.1",
    "python-magic>=0.4.27",
]

[project.optional-dependencies]
nemo = ["nemo_toolkit[asr]>=1.23.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
